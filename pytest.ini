[pytest]

# -s：禁用 stdout 捕获，允许测试中的 print() 输出显示在控制台。
# --alluredir report：生成 Allure 测试报告，并将报告数据存放在 report 目录。
# --clean-alluredir：在生成新报告前，清理旧的报告目录。
addopts = -s --alluredir report --clean-alluredir

testpaths = ./script

pythonpath = .

python_file = test*.py

# 测试类名必须以Test开头
python_classes = Test*

python_functions = test*

markers =
    app: 手机端
    web: 后台
    e2e: 手机领券后核对后台
